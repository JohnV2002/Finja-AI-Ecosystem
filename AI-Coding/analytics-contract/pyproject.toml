[project]
name = "analytics-contract"
version = "1.1.0"
description = "Language-neutral analytics contract with Error Contract integration"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "J. Apps", email = "contact@jappshome.de" }]
keywords = ["analytics", "telemetry", "metrics", "errors", "codex", "grok", "j-apps"]

[project.scripts]
analytics-contract = "analytics_contract.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["analytics_contract*"]

[tool.error-contract]
exempt = true
reason = "Analytics Contract tooling does not require its own runtime error namespace."

[tool.analytics-contract]
exempt = true
reason = "Analytics Contract tooling does not instrument its own detector and schemas."
