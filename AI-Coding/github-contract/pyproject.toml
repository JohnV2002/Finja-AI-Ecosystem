[project]
name = "github-contract"
version = "1.1.0"
description = "Cross-project J. Apps GitHub contract: headers, module versions, and no-leak checks"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "J. Apps", email = "contact@jappshome.de" }]
keywords = ["github", "headers", "semver", "finja", "codex", "grok", "j-apps"]

[project.scripts]
github-contract = "github_contract.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["github_contract*"]
