# ----------------------------------------------------------------------
#
#   Stateless weather microservice.
#   Port 8095 -> container 80.
#
# ======================================================================

services:
  weather:
    build: .
    container_name: finja_weather
    ports:
      - "8095:80"
    restart: unless-stopped
    env_file:
      - ./private/.env
    networks:
      - default
      - flare-finja-private
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - WEATHER_PROVIDER=${WEATHER_PROVIDER:-open-meteo}

networks:
  # Shared with the Analytics Collector and Flare (create once: docker network create flare-finja-private).
  flare-finja-private:
    external: true
