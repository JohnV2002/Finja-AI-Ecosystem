# Dependabot — open PRs for dependency bumps (never silent main).
# Python paths match real monorepo requirements.txt locations.
# Docs: https://docs.github.com/en/code-security/dependabot

version: 2

updates:
  # ---------------------------------------------------------------------------
  # Python (pip) — multi-directory monorepo
  # ---------------------------------------------------------------------------
  - package-ecosystem: "pip"
    directories:
      - "/finja-agentic-code/orchestrator"
      - "/finja-canvas"
      - "/finja-instagram"
      - "/finja-youtube"
      - "/finja-weather"
      - "/finja-neural-network"
      - "/finja-omni-test"
      - "/finja-Open-Web-UI/finja-Memory"
      - "/finja-Open-Web-UI/finja-web-crawler"
      - "/Finja-music/finja-music-docker-spotify"
      - "/Finja-music/finja-everything-in-once"
      - "/finja-chat"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    versioning-strategy: increase
    # Group the same library across modules into fewer PRs where possible.
    groups:
      python-patch-minor:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
      include: "scope"

  # ---------------------------------------------------------------------------
  # GitHub Actions — monthly (workflows under .github/workflows)
  # ---------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"

  # ---------------------------------------------------------------------------
  # Docker base images (optional signal) — weekly for modules with Dockerfiles
  # Dependabot docker ecosystem is per-directory; keep a few high-traffic ones.
  # ---------------------------------------------------------------------------
  - package-ecosystem: "docker"
    directories:
      - "/finja-weather"
      - "/finja-youtube"
      - "/finja-instagram"
      - "/finja-agentic-code/orchestrator"
      - "/finja-Open-Web-UI/finja-Memory"
      - "/finja-Open-Web-UI/finja-web-crawler"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
