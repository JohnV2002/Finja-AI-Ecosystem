# Dependabot — open PRs for dependency bumps (never silent main).
# Python paths match real monorepo requirements.txt locations.
# Docs: https://docs.github.com/en/code-security/dependabot

version: 2

updates:
  # ---------------------------------------------------------------------------
  # Python (pip) — multi-directory monorepo
  # ---------------------------------------------------------------------------
  - package-ecosystem: "pip"
    directories:
      - "/finja-agentic-code/orchestrator"
      - "/finja-canvas"
      - "/finja-instagram"
      - "/finja-youtube"
      - "/finja-weather"
      - "/finja-neural-network"
      - "/finja-omni-test"
      - "/finja-Open-Web-UI/finja-Memory"
      - "/finja-Open-Web-UI/finja-web-crawler"
      - "/Finja-music/finja-music-docker-spotify"
      - "/Finja-music/finja-everything-in-once"
      - "/finja-chat"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    versioning-strategy: increase
    # One scheduled Python PR across all configured modules, including majors.
    # Security fixes stay independently mergeable, but are grouped together.
    groups:
      python-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
      python-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
      include: "scope"

  # ---------------------------------------------------------------------------
  # GitHub Actions — monthly (workflows under .github/workflows)
  # ---------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      github-actions-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
      github-actions-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"

  # ---------------------------------------------------------------------------
  # Docker base images (optional signal) — weekly for modules with Dockerfiles
  # Dependabot docker ecosystem is per-directory; keep a few high-traffic ones.
  # ---------------------------------------------------------------------------
  - package-ecosystem: "docker"
    directories:
      - "/finja-weather"
      - "/finja-youtube"
      - "/finja-instagram"
      - "/finja-agentic-code/orchestrator"
      - "/finja-Open-Web-UI/finja-Memory"
      - "/finja-Open-Web-UI/finja-web-crawler"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      docker-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
      docker-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "docker"
