name: Memory Unit Tests

on:
  push:
    branches: [ "main", "dev" ]
    paths:
      - 'finja-Open-Web-UI/finja-Memory/**'
      - '.github/workflows/memory-tests.yml'
  pull_request:
    branches: [ "main", "dev" ]
    paths:
      - 'finja-Open-Web-UI/finja-Memory/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install dependencies
        working-directory: ./finja-Open-Web-UI/finja-Memory
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov aiohttp numpy scikit-learn rapidfuzz
          
      - name: Run Pytest Suite
        working-directory: ./finja-Open-Web-UI/finja-Memory
        run: |
          pytest test_memory_server.py test_adaptive_memory.py -v --cov=. --cov-branch --cov-report=term --cov-report=xml

      - name: Upload coverage to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-finja-memory
          path: finja-Open-Web-UI/finja-Memory/coverage.xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: finja-Open-Web-UI/finja-Memory/coverage.xml
          flags: finja-memory
          name: finja-memory
          fail_ci_if_error: false
