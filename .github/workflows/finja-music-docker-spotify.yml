name: Finja Music Docker Spotify Tests

on:
  push:
    branches: [ "main" ]
    paths:
      # Monitor changes in the specific module folder
      - 'Finja-music/finja-music-docker-spotify/**'
      # Monitor changes to this workflow file
      - '.github/workflows/finja-music-docker-spotify.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'Finja-music/finja-music-docker-spotify/**'
      - '.github/workflows/finja-music-docker-spotify.yml'


permissions:
  contents: read
jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Match the Python 3.11 runtime declared in the Dockerfile and README.
        python-version: ["3.11"]

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          # Hash based on the module's requirements.txt
          key: ${{ runner.os }}-pip-spotify-${{ hashFiles('Finja-music/finja-music-docker-spotify/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-spotify-

      - name: Install dependencies
        working-directory: ./Finja-music/finja-music-docker-spotify
        run: |
          python -m pip install --upgrade pip
          # Test Tools (httpx2: requirements.txt pins starlette>=1.0.0,
          # whose TestClient hard-requires httpx2 -- httpx alone isn't enough)
          pip install pytest pytest-cov pytest-mock httpx httpx2
          # App Dependencies (Core requirements)
          pip install fastapi uvicorn requests
          # Install from requirements.txt if present
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run app tests
        working-directory: ./Finja-music/finja-music-docker-spotify
        run: |
          # Include OAuth privacy regressions and module helper suites.
          pytest . -v --tb=short

      - name: Generate coverage report
        working-directory: ./Finja-music/finja-music-docker-spotify
        run: |
          pytest . --cov=. --cov-branch --cov-report=term --cov-report=xml

      - name: Upload coverage to artifacts
        uses: actions/upload-artifact@v7
        with:
          name: coverage-finja-music-spotify-${{ matrix.python-version }}
          path: Finja-music/finja-music-docker-spotify/coverage.xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: Finja-music/finja-music-docker-spotify/coverage.xml
          flags: finja-music-docker-spotify
          name: finja-music-spotify-py${{ matrix.python-version }}
          fail_ci_if_error: false
