# Trivy — filesystem scan of the monorepo (no root Dockerfile).
# Results land in the GitHub Security tab (SARIF).
# Default GitHub template assumed a single root image; Finja is multi-module.

name: Trivy

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Weekly (Thursday ~10:38 UTC) — same idea as the template cron
    - cron: "38 10 * * 4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy-fs:
    name: Filesystem scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner (fs)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          # Ignore unfixed noise a bit; still report fixed HIGH/CRITICAL
          ignore-unfixed: true

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
