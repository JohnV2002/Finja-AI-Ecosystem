name: Finja Agentic Code Tests

on:
  push:
    branches: [ "main" ]
    paths:
      - 'finja-agentic-code/**'
      - '.github/workflows/finja-agentic-code-tests.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'finja-agentic-code/**'
      - '.github/workflows/finja-agentic-code-tests.yml'


permissions:
  contents: read
jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Pinned to match the orchestrator/worker Dockerfiles (python:3.14-slim).
        python-version: ["3.14"]

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-agentic-${{ hashFiles('finja-agentic-code/orchestrator/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-agentic-

      - name: Install dependencies
        working-directory: ./finja-agentic-code
        run: |
          python -m pip install --upgrade pip
          # Starlette 1.x TestClient uses HTTPX2; legacy HTTPX is deprecated.
          pip install pytest pytest-cov pytest-mock httpx2 pyyaml
          # Orchestrator app dependencies (fastapi, pydantic, cryptography, ...)
          pip install -r orchestrator/requirements.txt

      - name: Run orchestrator tests
        working-directory: ./finja-agentic-code
        run: |
          pytest test_orchestrator.py -v --tb=short

      - name: Run worker tests
        working-directory: ./finja-agentic-code
        run: |
          pytest test_worker.py -v --tb=short

      - name: Run capability and sandbox lifecycle tests
        working-directory: ./finja-agentic-code
        run: |
          pytest test_l1_diagnosis.py test_repair_scope.py test_manual_scope.py test_incident_envelope.py test_testbed.py -v --tb=short

      - name: Generate coverage report
        working-directory: ./finja-agentic-code
        run: |
          pytest test_orchestrator.py test_worker.py test_l1_diagnosis.py test_repair_scope.py test_manual_scope.py test_incident_envelope.py test_testbed.py --cov=. --cov-branch --cov-report=term --cov-report=xml

      - name: Upload coverage to artifacts
        uses: actions/upload-artifact@v7
        with:
          name: coverage-finja-agentic-code-${{ matrix.python-version }}
          path: finja-agentic-code/coverage.xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: finja-agentic-code/coverage.xml
          flags: finja-agentic-code
          name: finja-agentic-code-py${{ matrix.python-version }}
          fail_ci_if_error: false
