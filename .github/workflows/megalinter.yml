# MegaLinter v10 — lint/format/consistency across the monorepo.
# Soft-fail via DISABLE_ERRORS in .mega-linter.yml (phase 1).
# Complements CodeQL (security), Sonar (quality), Trivy (supply chain), Pytest (behavior).

name: MegaLinter

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write
  pull-requests: write

concurrency:
  group: megalinter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        # Match monorepo Actions majors (Node 24 runners; avoid Node 20 deprecation)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: MegaLinter
        id: ml
        # Flavor cupcake: broad enough for monorepo, lighter than "all"
        uses: oxsecurity/megalinter/flavors/cupcake@v10.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload MegaLinter reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: megalinter-reports
          path: |
            megalinter-reports/**
          retention-days: 14
          # No SARIF upload to Code Scanning — multi-run same category is rejected.
          # Reports stay in this artifact + MegaLinter PR comment.
