#
#   Phase A test track. Runs the orchestrator against the deliberately
#   broken worker image, on its own port, with its own job directory and
#   limits short enough that a hanging phase fails in seconds instead of
#   ten minutes.
#
#   FLARE_TESTBED_JOBS_DIR is MANDATORY and must be an absolute host path
#   that NO production stack uses. It is not a matter of tidiness:
#   recover_incomplete_jobs() scans every job folder it can see on start
#   and resumes anything in a recoverable state. Pointed at a production
#   agent_jobs folder, this stack would pick up real in-flight jobs and
#   run them through the fault-injection worker. The override therefore
#   refuses to start rather than silently inheriting AGENT_JOBS_HOST_DIR
#   from .env, and the path is also handed to the worker containers, so
#   it must be the host path, not a container path.
#
#   Build the broken worker first (context is the module root):
#     docker build -f worker-broken/Dockerfile -t finja-agent-worker-broken:dev .
#
#   Then start the track beside a normal stack:
#     export FLARE_TESTBED_JOBS_DIR=/absolute/path/to/agent_jobs_testbed
#     mkdir -p "$FLARE_TESTBED_JOBS_DIR"
#     docker compose -p flare-testbed -f docker-compose.yml -f docker-compose.testbed.yml up -d --build
#     python testbed/run_testbed.py --base-url http://localhost:8078
#
#   Tear it down with the same -p, and with FLARE_TESTBED_JOBS_DIR still
#   set -- otherwise the interpolation above fails and the container stays:
#     docker compose -p flare-testbed -f docker-compose.yml -f docker-compose.testbed.yml down
#
#   The job tree is left behind owned by root, because the orchestrator
#   container writes into the bind mount as root. Deleting it as your own
#   user fails with "Permission denied"; clear it from a container instead
#   of reaching for sudo:
#     docker run --rm -v "$FLARE_TESTBED_JOBS_DIR":/target python:3.14-slim \
#       find /target -mindepth 1 -delete
#     rmdir "$FLARE_TESTBED_JOBS_DIR"
#
#   The -p is NOT optional. Without its own project name this runs in the
#   production project under the same service name `orchestrator`; Compose
#   then sees one service with a changed config and REPLACES the production
#   container with this one. The production stack goes down while the
#   command still looks successful.
#
#   `ports: !override` below is the same hazard from the other side:
#   Compose APPENDS sequences when merging -f files instead of replacing
#   them, so without the tag this service inherits "8077:8077" from
#   docker-compose.yml, tries to bind production's port as well, and the
#   start fails with "port is already allocated". Needs Compose v2.24.4
#   or newer. (`volumes` is exempt: it merges on the mount target, which
#   is why the /jobs bind below replaces the inherited one as intended.)
#
#   The inherited production env_file is replaced completely. Otherwise any
#   extra production credential in .env would reach the throwaway stack even
#   if the known keys below were cleared. This stack listens on loopback.
#
#   Every value here exists to make the track deterministic:
#     WORKER_IMAGE              the broken drop-in instead of the real sandbox
#     AGENT_JOBS_HOST_DIR       a separate job tree, never production's
#     OPENROUTER_API_KEY        empty, so no model is called and no diff appears
#     ORCHESTRATOR_AUTH_TOKEN   empty, or every submission is a 401
#     CODE_AGENT_TRANSPORT_KEY  empty, so no production secret and plaintext at rest
#     DEDUPE_WINDOW_SECONDS     0, or a repeated run returns the first job
#     JOB_*_TIMEOUT_SECONDS     short, so the hang scenarios finish quickly
#     HEARTBEAT_*               fast, so slow phases emit several reports
#
# ======================================================================

services:
  orchestrator:
    container_name: finja-agent-orchestrator-testbed
    env_file: !override []
    ports: !override
      - "127.0.0.1:8078:8077"
    environment:
      WORKER_IMAGE: finja-agent-worker-broken:dev
      WORKER_NETWORK: none
      AGENT_JOBS_HOST_DIR: ${FLARE_TESTBED_JOBS_DIR:?set it to an absolute jobs folder that no production stack uses}
      OPENROUTER_API_KEY: ""
      ORCHESTRATOR_AUTH_TOKEN: ""
      CODE_AGENT_TRANSPORT_KEY: ""
      FLARE_TESTBED_MODE: "1"
      DEDUPE_WINDOW_SECONDS: "0"
      JOB_TIMEOUT_SECONDS: "20"
      JOB_TOTAL_TIMEOUT_SECONDS: "60"
      FINJA_TIMEOUT_RETRY_AFTER_SECONDS: "5"
      HEARTBEAT_INTERVAL_SECONDS: "1"
      HEARTBEAT_STALE_SECONDS: "10"
      RETRY_BASE_DELAY_SECONDS: "0"
    volumes:
      - ${FLARE_TESTBED_JOBS_DIR:?set it to an absolute jobs folder that no production stack uses}:/jobs
      - /var/run/docker.sock:/var/run/docker.sock
    restart: "no"
